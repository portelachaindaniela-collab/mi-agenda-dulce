<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Agenda Dulce</title>
<meta name="description" content="Colegio, calendario, Dino y mi emprendimiento de budines">
<meta name="theme-color" content="#fbf6f0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f0; --card:#fff; --inset:#f4ece3; --ink:#2b2230; --muted:#7a6d78; --line:#eadfd4;
  --rosa:#d23f72; --rosa-soft:#fde4ec; --azul:#4562d0; --azul-soft:#e3e9ff;
  --verde:#24865a; --verde-soft:#dcf2e6; --ambar:#b5700c; --ambar-soft:#fcefd8;
  --rojo:#c8402f; --rojo-soft:#fbe3e0; --violeta:#7c4fcc; --violeta-soft:#efe6fd;
  --sombra:0 1px 2px rgba(60,30,40,.06),0 4px 14px rgba(60,30,40,.06);
  --en-boton:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a1619; --card:#241f23; --inset:#2e282c; --ink:#f3ecef; --muted:#b3a5ae; --line:#3a3237;
    --rosa:#ff7ea6; --rosa-soft:#3d2230; --azul:#8ea3ff; --azul-soft:#232a48;
    --verde:#6fd3a0; --verde-soft:#1b3328; --ambar:#f0b55a; --ambar-soft:#3a2c15;
    --rojo:#ff8f80; --rojo-soft:#3e2220; --violeta:#bb9cff; --violeta-soft:#2f2545;
    --sombra:0 1px 2px rgba(0,0,0,.3); --en-boton:#2b1420; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1619; --card:#241f23; --inset:#2e282c; --ink:#f3ecef; --muted:#b3a5ae; --line:#3a3237;
  --rosa:#ff7ea6; --rosa-soft:#3d2230; --azul:#8ea3ff; --azul-soft:#232a48;
  --verde:#6fd3a0; --verde-soft:#1b3328; --ambar:#f0b55a; --ambar-soft:#3a2c15;
  --rojo:#ff8f80; --rojo-soft:#3e2220; --violeta:#bb9cff; --violeta-soft:#2f2545;
  --sombra:0 1px 2px rgba(0,0,0,.3); --en-boton:#2b1420; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:12px 14px 84px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
header h1{font-size:21px;margin:0;font-weight:800;line-height:1.15}
header small{color:var(--muted);display:block;font-weight:600;font-size:13px}
.icono{border:0;background:var(--card);box-shadow:var(--sombra);width:40px;height:40px;border-radius:13px;font-size:19px;cursor:pointer;flex:none}
.cards{display:block}
.tarjeta{background:var(--card);border-radius:18px;box-shadow:var(--sombra);padding:13px 14px;margin-bottom:10px}
.tarjeta h2{font-size:16px;margin:0 0 6px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tarjeta h2 .mini{font-size:13px}
.sub{color:var(--muted);font-size:13px}
.vacio{color:var(--muted);font-size:14px;padding:4px 0;margin:0}
.pestanas{display:flex;gap:6px;overflow-x:auto;margin:0 -14px 10px;padding:2px 14px 4px;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestana{flex:none;border:0;border-radius:999px;padding:7px 13px;background:var(--card);box-shadow:var(--sombra);font-weight:700;cursor:pointer;font-size:14px;position:relative}
.pestana.activa{background:var(--ink);color:var(--bg)}
nav.abajo{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:5px 6px calc(5px + env(safe-area-inset-bottom));z-index:5}
nav.abajo .marca{display:none}
nav.abajo .botonera{display:flex;max-width:560px;width:100%}
nav.abajo button{flex:1;border:0;background:none;padding:5px 2px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:700;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav.abajo button span{font-size:21px;line-height:1}
nav.abajo button.activa{color:var(--rosa);background:var(--rosa-soft)}
.globo{position:absolute;top:0;right:calc(50% - 22px);background:var(--rojo);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.pestana .globo{top:-6px;right:-4px}
.fila{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.fila:first-of-type{border-top:0}
.fila .cuerpo{flex:1;min-width:0}
.fila .titulo{font-weight:700;overflow-wrap:anywhere;font-size:15px}
.fila .titulo.tachado{text-decoration:line-through;color:var(--muted)}
.tocable{cursor:pointer}
.check{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--line);background:var(--inset);cursor:pointer;display:grid;place-items:center;font-size:15px;color:#fff;padding:0}
.check.si{background:var(--verde);border-color:var(--verde)}
.punto{flex:none;width:10px;height:10px;border-radius:50%;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--inset);white-space:nowrap}
.chip.rosa{background:var(--rosa-soft);color:var(--rosa)} .chip.azul{background:var(--azul-soft);color:var(--azul)}
.chip.verde{background:var(--verde-soft);color:var(--verde)} .chip.ambar{background:var(--ambar-soft);color:var(--ambar)}
.chip.rojo{background:var(--rojo-soft);color:var(--rojo)} .chip.violeta{background:var(--violeta-soft);color:var(--violeta)}
button.chip{border:0;cursor:pointer}
a.btn{text-decoration:none;color:inherit}
a.btn.primario{color:var(--en-boton)}
.btn{border:0;border-radius:13px;padding:10px 15px;font-weight:800;cursor:pointer;background:var(--inset);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primario{background:var(--rosa);color:var(--en-boton)}
.btn.peligro{background:var(--rojo-soft);color:var(--rojo)}
.btn.chico{padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.ancho{width:100%}
.botones{display:flex;flex-wrap:wrap;gap:8px}
.barra-acciones{display:flex;gap:8px;margin-bottom:10px}
.barra-acciones .btn{flex:1}
.rapidos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.rapidos button{border:0;background:var(--card);box-shadow:var(--sombra);border-radius:15px;padding:8px 4px;font-weight:700;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.rapidos button span{font-size:20px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cifra{background:var(--inset);border-radius:13px;padding:8px 10px}
.cifra b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.cifra small{color:var(--muted);font-weight:700;font-size:12px}
.cifra.verde b{color:var(--verde)} .cifra.rosa b{color:var(--rosa)}
.monto{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.aviso{background:var(--ambar-soft);color:var(--ambar);border-radius:13px;padding:9px 12px;font-size:14px;font-weight:600;margin-bottom:10px}
.instalar{max-width:760px;display:flex;align-items:center;gap:12px;background:var(--violeta-soft);color:var(--ink);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.instalar img{width:44px;height:44px;border-radius:11px;flex:none}
.instalar div{flex:1;font-size:14px;font-weight:600}
.instalar b{display:block;font-size:15px}
.hoy-cole{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);font-weight:700}
.cal-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-cab b{font-size:17px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .dsem{font-size:12px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{border:0;background:var(--inset);border-radius:10px;height:42px;padding:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;min-width:0;font-size:14px}
.cal button.fuera{opacity:.35}
.cal button.hoy{outline:2px solid var(--rosa)}
.cal button.sel{background:var(--ink);color:var(--bg)}
.cal .puntos{display:flex;gap:2px;height:6px}
.cal .puntos i{width:6px;height:6px;border-radius:50%}
.leyenda{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:8px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.horario{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.horario .dia{background:var(--inset);border-radius:11px;padding:5px;min-width:0}
.horario .dia b{display:block;text-align:center;font-size:13px;margin-bottom:4px}
.horario .dia.hoy{outline:2px solid var(--rosa)}
.horario .mat{display:block;width:100%;border:0;border-radius:7px;padding:4px 2px;font-size:11px;font-weight:700;color:#fff;margin-bottom:3px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.horario .mas{display:block;width:100%;border:1px dashed var(--muted);background:none;border-radius:7px;font-size:13px;cursor:pointer;color:var(--muted)}
.barras{display:flex;align-items:flex-end;gap:10px;height:110px;padding-top:6px}
.barras .mes{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.barras .par{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.barras .par i{display:block;width:40%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:2px}
.barras small{font-size:12px;color:var(--muted);font-weight:700}
.receta-costos{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:6px}
.receta-costos div{background:var(--inset);border-radius:10px;padding:5px 9px;font-size:12.5px}
.receta-costos b{display:block;font-size:15px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:28px;height:28px;border-radius:9px;border:0;background:var(--inset);font-weight:800;cursor:pointer}
.stepper span{min-width:20px;text-align:center;font-weight:800}
.precio-in{width:80px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--inset);text-align:right}
.archivos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.archivo{border:0;background:var(--inset);border-radius:13px;padding:0;overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;min-width:0}
.archivo .vista{aspect-ratio:1;display:grid;place-items:center;font-size:34px;background:var(--line);position:relative}
.archivo .vista img{width:100%;height:100%;object-fit:cover;display:block}
.archivo .vista .punto{position:absolute;top:7px;left:7px;box-shadow:0 0 0 2px #fff}
.archivo .nom{font-size:12px;font-weight:700;padding:5px 7px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100dvh - 176px - env(safe-area-inset-bottom));min-height:320px;background:var(--card);border-radius:18px;box-shadow:var(--sombra);overflow:hidden}
.chat-lista{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msj{max-width:84%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.msj.yo{align-self:flex-end;background:var(--rosa);color:var(--en-boton);border-bottom-right-radius:5px}
.msj.otro{align-self:flex-start;background:var(--inset);border-bottom-left-radius:5px}
.msj .hora{display:block;font-size:11px;opacity:.75;text-align:right;margin-top:2px}
.msj img.foto{display:block;max-width:100%;max-height:220px;border-radius:10px;margin-bottom:6px}
.msj ul{margin:4px 0;padding-left:20px}
.fila-dino{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:90%}
.fila-dino img.av{width:30px;height:30px;border-radius:9px;flex:none}
.fila-dino .msj{max-width:100%}
.accion{background:var(--card);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:6px}
.pensando span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin:0 2px;animation:salto 1s infinite}
.pensando span:nth-child(2){animation-delay:.15s}.pensando span:nth-child(3){animation-delay:.3s}
@keyframes salto{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.sugerencias{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px;scrollbar-width:none}
.sugerencias::-webkit-scrollbar{display:none}
.sugerencias button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer}
.escribir{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line);align-items:flex-end}
.escribir textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--inset);border-radius:18px;padding:9px 13px;max-height:120px;min-height:40px;outline:none;font-size:15px}
.escribir textarea:focus{border-color:var(--rosa)}
.escribir button{flex:none;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;font-size:18px;background:var(--inset)}
.escribir button.enviar{background:var(--rosa);color:var(--en-boton)}
.adjunto{display:flex;align-items:center;gap:8px;padding:6px 12px 0;font-size:13px;color:var(--muted);font-weight:700}
.adjunto img{height:44px;border-radius:8px}
.adjunto button{border:0;background:var(--rojo-soft);color:var(--rojo);border-radius:8px;cursor:pointer;padding:3px 8px}
.chat-vacio{margin:auto;text-align:center;color:var(--muted);font-size:14px;max-width:300px}
.chat-vacio img{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 8px}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,10,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#modal[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.sheet img.previa{display:block;max-width:100%;max-height:240px;border-radius:12px;margin:0 auto 12px}
.campo{display:block;margin-bottom:11px}
.campo span{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.campo input,.campo select,.campo textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);outline:none}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--rosa)}
.campo textarea{min-height:80px;resize:vertical}
.campo.tilde{display:flex;align-items:center;gap:10px}
.campo.tilde input{width:22px;height:22px}
.campo.tilde span{margin:0;color:var(--ink)}
.ayuda{font-size:13px;color:var(--muted);margin:-5px 0 11px}
.acciones{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.acciones .izq{margin-right:auto}
.item-receta{display:grid;grid-template-columns:1fr 64px 48px 30px;gap:6px;align-items:center;margin-bottom:6px}
.item-receta select,.item-receta input{padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--inset);width:100%;min-width:0}
.item-receta .u{font-size:13px;color:var(--muted);font-weight:700}
.item-receta button{border:0;background:var(--rojo-soft);color:var(--rojo);border-radius:9px;height:30px;cursor:pointer}
.total-receta{background:var(--verde-soft);color:var(--verde);border-radius:12px;padding:9px 12px;font-weight:700;margin:6px 0 11px}
.pasos{white-space:pre-wrap;font-size:14px;color:var(--muted);margin-top:6px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:20;box-shadow:var(--sombra);max-width:calc(100% - 32px);text-align:center}
body.mama #app{height:100dvh;display:flex;flex-direction:column;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
body.mama nav.abajo{display:none}
body.mama .pestanas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0 0 10px;padding:2px 0 4px;overflow:visible}
body.mama .pestana{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 1px;font-size:11.5px;border-radius:14px;min-width:0}
body.mama .pestana span:first-child{font-size:18px;line-height:1.1}
body.mama .chat{flex:1;height:auto;min-height:0}
body.mama .mama-cuerpo{flex:1;overflow-y:auto;min-height:0}
@media (max-width:380px){.cifra b{font-size:15px}.rapidos button{font-size:11.5px}nav.abajo button{font-size:10.5px}}

/* compu */
@media (min-width:900px){
  body{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
  nav.abajo{position:sticky;top:0;grid-column:1;grid-row:1;height:100vh;border-top:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;padding:22px 14px;gap:18px}
  nav.abajo .marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;line-height:1.1}
  nav.abajo .marca img{width:46px;height:46px;border-radius:12px}
  nav.abajo .botonera{flex-direction:column;gap:4px}
  nav.abajo button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px}
  nav.abajo button span{font-size:20px}
  nav.abajo .globo{position:static;margin-left:auto}
  #app{grid-column:2;grid-row:1;max-width:1120px;width:100%;margin:0;padding:24px 32px 32px}
  header{margin-bottom:16px}
  header h1{font-size:26px}
  .pestanas{margin:0 0 14px;padding:2px}
  .cards{columns:2;column-gap:16px}
  .cards>*{break-inside:avoid}
  .tarjeta{padding:16px 18px;margin-bottom:16px}
  .rapidos{grid-template-columns:repeat(4,minmax(0,170px))}
  .barra-acciones{max-width:520px}
  .cal button{height:62px;font-size:15px}
  .chat{height:calc(100vh - 150px)}
  .msj{max-width:68%}
  #modal{align-items:center}
  .sheet{border-radius:22px;max-height:88vh}
  .toast{bottom:28px}
  body.mama{display:block}
  body.mama #app{max-width:760px;margin:0 auto}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="abajo"><div class="marca"><img src="icono-192.png" alt="">Mi Agenda<br>Dulce</div><div class="botonera" id="nav"></div></nav>
<div id="modal" hidden></div>
<input type="file" id="subir-archivo" accept="image/*,application/pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.odt" multiple hidden>
<input type="file" id="subir-foto" accept="image/*" capture="environment" hidden>
<input type="file" id="dino-foto" accept="image/*" hidden>
<script>
const KEY = 'agenda-dulce-v1';
const KEY_FAMILIA = 'agenda-dulce-familia';
const KEY_DINO = 'agenda-dulce-dino';
const KEY_CHAT = 'agenda-dulce-chat';
const API = 'https://itultpcdafpxpgtblgfb.supabase.co/functions/v1/agenda-dulce';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const DIAS_LARGOS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

const aFecha = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const diasHasta = s => Math.round((aFecha(s) - aFecha(hoy())) / 864e5);
const fechaCorta = s => { const d = aFecha(s); return DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const cuando = s => {
  if (!s) return 'sin fecha';
  const n = diasHasta(s);
  if (n === 0) return 'hoy';
  if (n === 1) return 'mañana';
  if (n === -1) return 'ayer';
  if (n < 0) return 'hace ' + (-n) + ' días';
  if (n < 7) return 'en ' + n + ' días';
  return fechaCorta(s);
};

/* familia: el link de conexión trae #m=CODIGO (mamá) o #v=CODIGO (Valentina); también acepta el formato viejo
   #familia=CODIGO&quien=mama|chica. Si el link llega cortado y no dice quién es, la app lo pregunta. */
function leerLink(hash) {
  const h = new URLSearchParams(String(hash || '').replace(/^#/, ''));
  const codigo = h.get('m') || h.get('v') || h.get('familia');
  if (!codigo || codigo.length < 16) return null;
  const quien = h.get('m') ? 'mama' : h.get('v') ? 'chica' : ['mama', 'chica'].includes(h.get('quien')) ? h.get('quien') : null;
  return { codigo, quien };
}

/* ---------- archivos del cole (IndexedDB, quedan en el aparato) ---------- */
const idb = (() => {
  let p;
  const abrir = () => p || (p = new Promise((ok, mal) => {
    const r = indexedDB.open('agenda-dulce', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('archivos', { keyPath: 'id' });
    r.onsuccess = () => ok(r.result);
    r.onerror = () => mal(r.error);
  }));
  const tx = async (modo, fn) => {
    const d = await abrir();
    return new Promise((ok, mal) => {
      const t = d.transaction('archivos', modo);
      const req = fn(t.objectStore('archivos'));
      t.oncomplete = () => ok(req?.result);
      t.onerror = () => mal(t.error);
    });
  };
  return { todos: () => tx('readonly', s => s.getAll()), poner: a => tx('readwrite', s => s.put(a)), sacar: id => tx('readwrite', s => s.delete(id)) };
})();
let archivos = [];
const urls = new Map();
const urlDe = a => { if (!urls.has(a.id)) urls.set(a.id, URL.createObjectURL(a.blob)); return urls.get(a.id); };
const esImagen = a => /^image\//.test(a.tipo);
const iconoArchivo = a => /pdf/.test(a.tipo) ? '📕' : /word|document|odt/.test(a.tipo + a.nombre) ? '📘' : /sheet|excel|xls/.test(a.tipo + a.nombre) ? '📗' : /presentation|ppt/.test(a.tipo + a.nombre) ? '📙' : '📄';
idb.todos().then(a => { archivos = a || []; if (ui.vista === 'colegio') render(); }).catch(() => {});

async function guardarArchivos(lista) {
  let n = 0;
  for (const f of lista) {
    if (f.size > 25 * 1024 * 1024) { avisar(f.name + ' es muy pesado (máx. 25 MB)'); continue; }
    const a = { id: uid(), nombre: f.name || 'foto.jpg', tipo: f.type, tamano: f.size, materiaId: ui.archMateria, nota: '', fecha: hoy(), blob: f };
    try { await idb.poner(a); archivos.push(a); n++; } catch (e) { avisar('No pude guardar ' + a.nombre); }
  }
  if (n) avisar(n === 1 ? 'Guardado 📎' : n + ' archivos guardados 📎');
  render();
}
async function achicarImagen(blob, max = 1280) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k);
  c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.82);
}

let formActual = null;
function campoHTML(c, v) {
  const val = v ?? c.valor ?? '';
  if (c.tipo === 'select') {
    return `<label class="campo"><span>${c.label}</span><select name="${c.nombre}">${c.opciones.map(([o, l]) => `<option value="${esc(o)}" ${String(o) === String(val) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
  }
  if (c.tipo === 'check') return `<label class="campo tilde"><input type="checkbox" name="${c.nombre}" ${val ? 'checked' : ''}><span>${c.label}</span></label>`;
  if (c.tipo === 'textarea') return `<label class="campo"><span>${c.label}</span><textarea name="${c.nombre}" placeholder="${esc(c.ph || '')}">${esc(val)}</textarea></label>`;
  const tipo = c.tipo === 'numero' ? 'number' : c.tipo === 'fecha' ? 'date' : 'text';
  const extra = c.tipo === 'numero' ? 'inputmode="decimal" step="any" min="0"' : '';
  return `<label class="campo"><span>${c.label}</span><input type="${tipo}" name="${c.nombre}" value="${esc(val)}" placeholder="${esc(c.ph || '')}" ${extra} ${c.requerido ? 'required' : ''}></label>${c.ayuda ? `<p class="ayuda">${c.ayuda}</p>` : ''}`;
}
function abrirForm({ titulo, campos, valores = {}, guardar, borrar, textoGuardar = 'Guardar', arriba = '', extra = '' }) {
  formActual = { campos, guardar, borrar };
  const m = document.getElementById('modal');
  m.innerHTML = `<div class="sheet"><h2>${titulo}</h2>${arriba}<form id="f">${campos.map(c => campoHTML(c, valores[c.nombre])).join('')}
    <div class="acciones">${borrar ? '<button type="button" class="btn peligro izq" data-act="m-borrar">Borrar</button>' : ''}${extra}
    <button type="button" class="btn" data-act="m-cerrar">Cancelar</button><button class="btn primario">${textoGuardar}</button></div></form></div>`;
  m.hidden = false;
  const primero = m.querySelector('input[type=text],input[type=number]');
  if (primero && !primero.value && matchMedia('(pointer:fine)').matches) setTimeout(() => primero.focus(), 50);
}
function cerrarModal() { const m = document.getElementById('modal'); m.hidden = true; m.innerHTML = ''; formActual = null; recetaEdit = null; }
function leerForm(form) {
  const o = {};
  for (const c of formActual.campos) {
    const el = form.elements[c.nombre];
    if (!el) continue;
    if (c.tipo === 'check') o[c.nombre] = el.checked;
    else if (c.tipo === 'numero') o[c.nombre] = el.value === '' ? '' : num(el.value);
    else o[c.nombre] = el.value.trim();
  }
  return o;
}

  else S.lista.push({ id: uid(), ingId, nombre: i.nombre, paquetes, precio: num(i.precio), check: false });
}

function respuestaLocal(t) {
  const x = t.toLowerCase();
  const lista = (arr, f) => arr.length ? arr.map(f).join('\n') : null;
  if (/tarea|deber|que tengo que hacer|qué tengo que hacer/.test(x)) {
    const l = lista(pendientes().slice(0, 8), t => `- **${t.titulo}** (${nombreMat(t.materiaId)}) · ${cuando(t.fecha)}`);
    return l ? 'Estas son tus tareas pendientes:\n' + l : '¡No tenés tareas pendientes! 🎉';
  }
  if (/examen|prueba|evaluaci|estudiar/.test(x)) {
    const l = lista(proxExamenes().slice(0, 6), e => `- **${nombreMat(e.materiaId)}**: ${e.tema} · faltan ${diasHasta(e.fecha)} días`);
    return l ? 'Tus próximos exámenes:\n' + l : 'No tenés exámenes anotados.';
  }
  if (/plata|gan[eéa]|vend|gast|negocio|cobr/.test(x)) {
    const r = resumenMes(hoy().slice(0, 7));
    return `Este mes ganaste **${plata(r.ganado)}**, gastaste **${plata(r.gastado)}** y te quedaron **${plata(r.ganancia)}**.` + (r.porCobrar ? ` Te deben ${plata(r.porCobrar)}.` : '');
  }
  if (/hoy|horario|clase|mañana/.test(x)) {
    const dia = new Date().getDay();
    return 'Hoy tenés: ' + ((S.horario[dia] || []).map(nombreMat).join(', ') || 'nada cargado en el horario') + '.';
  }
  return null;
}

function fmtDino(t) {
  const lineas = esc(t).split('\n');
  let html = '', enLista = false;
  for (const l of lineas) {
    const item = l.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)/);
    if (item) { if (!enLista) { html += '<ul>'; enLista = true; } html += '<li>' + item[1] + '</li>'; continue; }
    if (enLista) { html += '</ul>'; enLista = false; }
    html += l ? l + '<br>' : '<br>';
  }
  if (enLista) html += '</ul>';
  return html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])_(.+?)_(?=[\s).,!?]|$)/g, '$1<i>$2</i>').replace(/(<br>)+$/, '');
}

const KEY_AVISOS = 'agenda-dulce-avisos';
const soportaPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const avisosActivos = () => soportaPush() && Notification.permission === 'granted' && leer(KEY_AVISOS, false);
const b64aBytes = b => { const t = atob((b + '='.repeat((4 - b.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(t, c => c.charCodeAt(0)); };
async function suscribirPush(probar) {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) {
    const { clave } = await api('push-clave');
    sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64aBytes(clave) });
  }
  await api('suscribir', { de: yo(), sub: sub.toJSON(), probar });
}
async function activarAvisos() {
  if (!fam.codigo) { avisar('Primero conectá la agenda con el link'); return; }
  if (!soportaPush()) { avisar(esIOS && !instalada() ? 'En iPhone primero instalá la app: Compartir → Agregar a inicio' : 'Este navegador no permite avisos'); return; }
  const permiso = await Notification.requestPermission();
  if (permiso !== 'granted') { avisar('Sin permiso no te puedo avisar. Activalo en los ajustes del celu.'); render(); return; }
  try { await suscribirPush(true); escribir(KEY_AVISOS, true); avisar('¡Avisos activados! 🔔'); }
  catch (e) { avisar('No pude activar los avisos. Probá de nuevo.'); }
  render();
}

function itemsDelDia(f) {
  const it = [];
  S.tareas.filter(t => t.fecha === f).forEach(t => it.push({ color: 'var(--azul)', texto: '📝 ' + t.titulo + ' (' + nombreMat(t.materiaId) + ')', act: 'tarea-edit', id: t.id, hecho: t.hecha }));

  S.ventas.filter(v => v.fecha === f).forEach(v => it.push({ color: 'var(--ambar)', texto: '🧁 Entregar ' + v.producto + ' × ' + v.cant + (v.cliente ? ' a ' + v.cliente : ''), act: 'venta-edit', id: v.id, hecho: v.entregado }));
  S.eventos.filter(e => e.fecha === f).forEach(e => it.push({ color: 'var(--violeta)', texto: emojiEvento(e.tipo) + ' ' + e.titulo, act: 'evento-edit', id: e.id }));
  return it;
}
function vistaCalendario() {
  const [y, m] = ui.calMes.split('-').map(Number);
  const primero = new Date(y, m - 1, 1);
  const inicio = new Date(y, m - 1, 1 - ((primero.getDay() + 6) % 7));
  const celdas = [];
  for (let k = 0; k < 42; k++) {
    const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + k);
    if (k % 7 === 0 && k >= 28 && d.getMonth() !== m - 1) break;
    const f = iso(d);
    const colores = [...new Set(itemsDelDia(f).map(i => i.color))].slice(0, 4);
    celdas.push(`<button class="${d.getMonth() !== m - 1 ? 'fuera' : ''} ${f === hoy() ? 'hoy' : ''} ${f === ui.calDia ? 'sel' : ''}" data-act="cal-dia" data-f="${f}">${d.getDate()}<span class="puntos">${colores.map(c => `<i style="background:${c}"></i>`).join('')}</span></button>`);
  }
  const items = itemsDelDia(ui.calDia);
  const dSel = aFecha(ui.calDia);
  return `<div class="cards"><div class="tarjeta"><div class="cal-cab"><button class="icono" data-act="cal-mes" data-n="-1" aria-label="Mes anterior">‹</button>
    <b>${MESES[m - 1]} ${y}</b><button class="icono" data-act="cal-mes" data-n="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<div class="dsem">${x}</div>`).join('')}${celdas.join('')}</div>
    <div class="leyenda"><span><i class="punto" style="background:var(--azul)"></i>Tareas</span><span><i class="punto" style="background:var(--rosa)"></i>Exámenes</span><span><i class="punto" style="background:var(--ambar)"></i>Pedidos</span><span><i class="punto" style="background:var(--violeta)"></i>Eventos</span></div></div>
    <div class="tarjeta"><h2>${DIAS_LARGOS[dSel.getDay()].replace(/^./, c => c.toUpperCase())} ${dSel.getDate()} de ${MESES[dSel.getMonth()]} <button class="btn chico primario" data-act="nuevo-evento">+ Evento</button></h2>
    ${items.length ? items.map(i => `<div class="fila tocable" data-act="${i.act}" data-id="${i.id}"><span class="punto" style="background:${i.color}"></span><div class="cuerpo"><div class="titulo ${i.hecho ? 'tachado' : ''}">${esc(i.texto)}</div></div></div>`).join('') : '<p class="vacio">Nada anotado este día.</p>'}</div></div>`;

          ${(() => { const f = r.items.map(it => ingrediente(it.ingId)).filter(i => i && !num(i.precio)).map(i => i.nombre); return f.length ? `<p class="sub" style="color:var(--ambar);margin:6px 0 0">⚠️ Faltan precios de ${esc(f.join(', '))}: cargalos en 🏪 Súper para que la cuenta dé bien.</p>` : ''; })()}
          ${r.pasos ? `<div class="pasos">${esc(r.pasos)}</div>` : ''}
          <div class="botones" style="margin-top:8px"><button class="btn chico" data-act="receta-edit" data-id="${r.id}">Editar</button><button class="btn chico" data-act="lista-receta" data-id="${r.id}">🛒 Comprar para hacerla</button></div></div>`;

      <p class="sub">El precio sugerido es ${String(S.margen).replace('.', ',')} veces lo que te cuesta, para cubrir gas, luz, packaging y tu trabajo. Se cambia en ⚙️.</p>`;
  } else if (t === 'ventas') {
    const porEntregar = S.ventas.filter(v => !v.entregado).sort((a, b) => a.fecha.localeCompare(b.fecha));
    const resto = S.ventas.filter(v => v.entregado).sort((a, b) => b.fecha.localeCompare(a.fecha));
    html += `<div class="barra-acciones"><button class="btn primario" data-act="nueva-venta">+ Nueva venta o pedido</button></div><div class="cards">
      <div class="tarjeta"><h2>Por entregar</h2>${porEntregar.length ? porEntregar.map(filaVenta).join('') : '<p class="vacio">No hay pedidos pendientes.</p>'}</div>
      <div class="tarjeta"><h2>Entregadas</h2>${resto.length ? resto.slice(0, 40).map(filaVenta).join('') : '<p class="vacio">Acá van a aparecer tus ventas.</p>'}</div></div>`;
  } else {
    const r = resumenMes(ui.finMes);
    const [y, m] = ui.finMes.split('-').map(Number);
    const meses = [];
    for (let k = 5; k >= 0; k--) meses.push(iso(new Date(y, m - 1 - k, 1)).slice(0, 7));
    const datos = meses.map(mm => ({ mm, ...resumenMes(mm) }));
    const max = Math.max(1, ...datos.map(d => Math.max(d.ganado, d.gastado)));
    const top = {};
    r.ventas.forEach(v => { top[v.producto] = (top[v.producto] || 0) + num(v.cant); });
    const ranking = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 3);
    const movs = [
      ...r.ventas.filter(v => v.pagado).map(v => ({ fecha: v.fecha, texto: '🧁 ' + v.producto + ' × ' + v.cant + (v.cliente ? ' · ' + v.cliente : ''), monto: totalVenta(v), act: 'venta-edit', id: v.id })),
      ...S.gastos.filter(g => mesDe(g.fecha) === ui.finMes).map(g => ({ fecha: g.fecha, texto: '💸 ' + g.concepto, monto: -num(g.monto), act: 'gasto-edit', id: g.id }))
    ].sort((a, b) => b.fecha.localeCompare(a.fecha));
    html += `<div class="cards"><div class="tarjeta"><div class="cal-cab"><button class="icono" data-act="fin-mes" data-n="-1" aria-label="Mes anterior">‹</button>
      <b>${MESES[m - 1]} ${y}</b><button class="icono" data-act="fin-mes" data-n="1" aria-label="Mes siguiente">›</button></div>
      <div class="cifras"><div class="cifra verde"><small>Ganaste</small><b>${plata(r.ganado)}</b></div><div class="cifra rosa"><small>Gastaste</small><b>${plata(r.gastado)}</b></div><div class="cifra"><small>Te quedó</small><b>${plata(r.ganancia)}</b></div></div>
      ${r.porCobrar ? `<div class="aviso" style="margin:8px 0 0">Te deben ${plata(r.porCobrar)} de ventas sin cobrar.</div>` : ''}</div>
      <div class="tarjeta"><h2>Últimos 6 meses</h2><div class="barras">${datos.map(d => `<div class="mes"><div class="par">
        <i style="height:${d.ganado / max * 100}%;background:var(--verde)" title="Ganaste ${plata(d.ganado)}"></i><i style="height:${d.gastado / max * 100}%;background:var(--rosa)" title="Gastaste ${plata(d.gastado)}"></i></div>
        <small>${MESES[Number(d.mm.slice(5)) - 1].slice(0, 3)}</small></div>`).join('')}</div>
        <div class="leyenda"><span><i class="punto" style="background:var(--verde)"></i>Ganaste</span><span><i class="punto" style="background:var(--rosa)"></i>Gastaste</span></div></div>
      ${ranking.length ? `<div class="tarjeta"><h2>Lo más vendido</h2>${ranking.map(([p, c], k) => `<div class="fila"><b>${['🥇', '🥈', '🥉'][k]}</b><div class="cuerpo"><div class="titulo">${esc(p)}</div></div><span class="chip">${c} vendidos</span></div>`).join('')}</div>` : ''}
      <div class="tarjeta"><h2>Movimientos <button class="btn chico" data-act="nuevo-gasto">+ Gasto</button></h2>
      ${movs.length ? movs.map(x => `<div class="fila tocable" data-act="${x.act}" data-id="${x.id}"><div class="cuerpo"><div class="titulo">${esc(x.texto)}</div><div class="sub">${fechaCorta(x.fecha)}</div></div><span class="monto" style="color:${x.monto >= 0 ? 'var(--verde)' : 'var(--rosa)'}">${x.monto >= 0 ? '+' : ''}${plata(x.monto)}</span></div>`).join('') : '<p class="vacio">Sin movimientos este mes.</p>'}
      <p class="sub" style="margin:6px 0 0">Las ventas cobradas y las compras del súper se anotan solas.</p></div></div>`;
  }
  return html;
}

const KEY_NOV = 'agenda-dulce-novedades';
let novedades = leer(KEY_NOV, []);
let novCargadas = false;
const novSinLeer = () => novedades.filter(n => !n.leida).length;
async function traerNovedades() {
  if (!fam.codigo || !esMama()) return;
  try {
    const desde = novedades.reduce((m, n) => Math.max(m, n.id), 0);
    const { novedades: nuevas } = await api('novedades', { desde });
    novCargadas = true;
    const sumar = (nuevas || []).filter(n => !novedades.some(x => x.id === n.id));
    if (sumar.length) {
      novedades = [...novedades, ...sumar].slice(-300);
      escribir(KEY_NOV, novedades);
      if (!avisosActivos() && document.hidden) notificar({ de: 'chica', texto: sumar[sumar.length - 1].texto });
    }
    if (sumar.length || ui.mama === 'novedades') {
      if (ui.mama === 'novedades' && !document.hidden && novSinLeer()) marcarNovedadesLeidas();
      if (ui.mama !== 'chat') render(); else pintarNav();
    }
  } catch (e) { novCargadas = true; }
}
async function marcarNovedadesLeidas() {
  novedades.forEach(n => { n.leida = true; });
  escribir(KEY_NOV, novedades);
  try { await api('novedades-leidas'); } catch (e) {}
}
function vistaNovedades() {
  const nom = esc(fam.nombre || 'Valentina');
  const lista = novedades.slice().reverse();
  const mostrar = ui.verTodasNov ? lista : lista.slice(0, 60);
  let dia = '';
  const filas = mostrar.map(n => {
    const d = iso(new Date(n.creado));
    const sep = d !== dia ? (dia = d, `<div class="sub" style="font-weight:800;margin:10px 0 2px;text-transform:capitalize">${cuando(d)}</div>`) : '';
    return sep + `<div class="fila"><div class="cuerpo"><div class="titulo" style="font-weight:${n.leida ? 600 : 800}">${esc(n.texto)}</div></div><span class="sub">${horaDe(n.creado)}</span></div>`;
  }).join('');
  return `${tarjetaAvisos()}<div class="tarjeta"><h2>Cambios en la agenda de ${nom} <button class="btn chico" data-act="recargar-novedades" aria-label="Actualizar">↻</button></h2>
    ${filas || `<p class="vacio">${novCargadas ? `Todavía no hay cambios. Acá vas a ver cuando ${nom} agrega, empieza o termina una tarea, cuando carga un examen o una nota, y cuando cambia una fecha.` : 'Cargando…'}</p>`}
    ${!ui.verTodasNov && lista.length > 60 ? '<button class="btn chico" data-act="novedades-todas">Ver todos</button>' : ''}</div>`;
}

let agendaMama = null;
async function traerAgendaMama() {
  try { agendaMama = { ...(await api('agenda')), t: Date.now() }; } catch (e) { agendaMama = { error: true, t: Date.now() }; }
  if (esMama() && ui.mama !== 'chat') render();
}
const chipNota = n => `<span class="chip ${n >= 7 ? 'verde' : n >= 4 ? 'ambar' : 'rojo'}">Nota ${String(n).replace('.', ',')}</span>`;
function filaTareaMama(t) {
  const n = t.fecha ? diasHasta(t.fecha) : null;
  const chip = t.hecha ? '<span class="chip verde">✓ hecha</span>' : `<span class="chip ${n != null && n < 0 ? 'rojo' : n != null && n <= 1 ? 'ambar' : ''}">${cuando(t.fecha)}</span>`;
  return `<div class="fila"><span class="check ${t.hecha ? 'si' : ''}" aria-hidden="true">${t.hecha ? '✓' : ''}</span><div class="cuerpo"><div class="titulo ${t.hecha ? 'tachado' : ''}">${esc(t.titulo)}</div><div class="sub">${esc(t.materia || 'Sin materia')}${t.fecha ? ' · para el ' + fechaCorta(t.fecha) : ''}</div></div>${chip}</div>`;
}
function filaExamenMama(e) {
  const n = e.fecha ? diasHasta(e.fecha) : null;
  const chip = e.nota != null ? chipNota(e.nota) : `<span class="chip ${n == null || n < 0 ? '' : n <= 3 ? 'rosa' : 'azul'}">${n == null ? 'sin fecha' : n < 0 ? 'falta la nota' : n === 0 ? '¡hoy!' : n === 1 ? 'mañana' : 'faltan ' + n + ' días'}</span>`;
  return `<div class="fila"><span class="punto" style="background:var(--rosa)"></span><div class="cuerpo"><div class="titulo">${esc(e.materia || 'Sin materia')}: ${esc(e.tema)}</div><div class="sub">${e.fecha ? fechaCorta(e.fecha) : 'sin fecha'}</div></div>${chip}</div>`;
}
const tarjetaLista = (titulo, filas, vacio) => `<div class="tarjeta"><h2>${titulo}</h2>${filas.length ? filas.join('') : `<p class="vacio">${vacio}</p>`}</div>`;
function vistaMama(tab) {
  if (!agendaMama) traerAgendaMama();
  const cargando = !agendaMama;
  const fallo = !!agendaMama?.error;
  const a = { tareas: [], examenes: [], eventos: [], ...(agendaMama?.agenda || {}) };
  const nom = esc(fam.nombre || 'Valentina');
  const estado = cargando ? 'Cargando…' : fallo ? 'No se pudo cargar. ¿Hay internet?' : agendaMama.actualizado ? `${nom} la actualizó ${cuando(iso(new Date(agendaMama.actualizado)))} a las ${horaDe(agendaMama.actualizado)}` : `${nom} todavía no abrió su agenda conectada.`;
  const pie = `<p class="sub" style="margin:2px 0 10px;display:flex;align-items:center;gap:8px">${estado}${cargando ? '' : '<button class="btn chico" data-act="recargar-agenda" aria-label="Actualizar">↻</button>'}</p>`;
  const vacio = texto => cargando ? '…' : texto;
  const porFecha = (x, y) => (x.fecha || '9').localeCompare(y.fecha || '9');
  if (tab === 'tareas') {
    const pend = a.tareas.filter(t => !t.hecha).sort(porFecha);
    const atrasadas = pend.filter(t => t.fecha && diasHasta(t.fecha) < 0);
    const semana = pend.filter(t => !t.fecha || (diasHasta(t.fecha) >= 0 && diasHasta(t.fecha) < 7));
    const despues = pend.filter(t => t.fecha && diasHasta(t.fecha) >= 7);
    const hechas = a.tareas.filter(t => t.hecha).sort((x, y) => porFecha(y, x));
    return `${pie}<div class="cifras" style="margin-bottom:10px"><div class="cifra"><small>Pendientes</small><b>${pend.length}</b></div><div class="cifra rosa"><small>Atrasadas</small><b>${atrasadas.length}</b></div><div class="cifra verde"><small>Hechas</small><b>${hechas.length}</b></div></div>
      <div class="cards">${tarjetaLista(atrasadas.length ? '⚠️ Atrasadas' : 'Atrasadas', atrasadas.map(filaTareaMama), vacio('Ninguna atrasada 🎉'))}
      ${tarjetaLista('Esta semana', semana.map(filaTareaMama), vacio('Nada para esta semana.'))}
      ${tarjetaLista('Más adelante', despues.map(filaTareaMama), vacio('Nada anotado para más adelante.'))}
      ${tarjetaLista('Últimas hechas', hechas.slice(0, 10).map(filaTareaMama), vacio('Todavía no marcó tareas como hechas.'))}</div>`;
  }
  if (tab === 'examenes') {
    const prox = a.examenes.filter(e => e.fecha && diasHasta(e.fecha) >= 0).sort(porFecha);
    const rendidos = a.examenes.filter(e => !e.fecha || diasHasta(e.fecha) < 0).sort((x, y) => porFecha(y, x));
    const notas = {};
    a.examenes.filter(e => e.nota != null).forEach(e => { (notas[e.materia || 'Sin materia'] = notas[e.materia || 'Sin materia'] || []).push(e.nota); });
    const proms = Object.entries(notas).map(([m, ns]) => [m, ns.reduce((s, n) => s + n, 0) / ns.length, ns.length]).sort((x, y) => x[0].localeCompare(y[0]));
    return `${pie}<div class="cards">${tarjetaLista('Próximos', prox.map(filaExamenMama), vacio('No tiene exámenes anotados.'))}
      ${tarjetaLista('Promedios', proms.map(([m, p, c]) => `<div class="fila"><div class="cuerpo"><div class="titulo">${esc(m)}</div><div class="sub">${c} nota${c === 1 ? '' : 's'}</div></div>${chipNota(Math.round(p * 10) / 10)}</div>`), vacio('Todavía no cargó notas.'))}
      ${tarjetaLista('Ya rendidos', rendidos.slice(0, 20).map(filaExamenMama), vacio('Todavía no rindió ninguno.'))}</div>`;
  }
  const webcal = agendaMama?.ics ? agendaMama.ics.replace(/^https:/, 'webcal:') : '';
  const evs = a.eventos.filter(e => e.fecha && diasHasta(e.fecha) >= 0).sort(porFecha);
  return `${pie}<div class="cards"><div class="tarjeta"><h2>📅 En tu calendario</h2><p class="sub" style="margin:0 0 8px">Las tareas y exámenes de ${nom} aparecen solos en el calendario de tu celu y se actualizan cada tanto.</p>
    ${webcal ? `<div class="botones"><a class="btn primario chico" href="https://calendar.google.com/calendar/render?cid=${encodeURIComponent(webcal)}" target="_blank" rel="noopener">Google Calendar</a><a class="btn chico" href="${esc(webcal)}">iPhone / otro</a><button class="btn chico" data-act="copiar-ics">Copiar link</button></div>` : `<p class="vacio">${cargando ? 'Cargando el link…' : 'Los botones aparecen cuando haya internet.'}</p>`}</div>
    ${tarjetaLista('Eventos', evs.map(e => `<div class="fila"><span class="punto" style="background:var(--violeta)"></span><div class="cuerpo"><div class="titulo">${emojiEvento(e.tipo)} ${esc(e.titulo)}</div></div><span class="chip violeta">${cuando(e.fecha)}</span></div>`), vacio('No tiene eventos próximos.'))}</div>`;
}

    ${fam.codigo ? `<div class="tarjeta"><h2>¿Este celu es de mamá?</h2><p class="sub" style="margin:0 0 8px">Si tu mamá abrió la agenda en su celu y le aparece esto, pasala al modo mamá.</p><button class="btn chico" data-act="soy" data-q="mama" data-confirmar="1">👩 Pasar a modo mamá</button></div>` : ''}
    <div class="tarjeta"><h2>App en el celu o la compu</h2>${instalada() ? '<p class="vacio">✅ Ya está instalada.</p>' : tarjetaInstalar(true)}</div>
    ${fam.codigo ? `<div class="tarjeta"><h2>Chat con mamá y Dino</h2><p class="vacio">${chatOk === 'codigo' ? '⚠️ El link de conexión no es válido.' : '✅ Conectada.'}</p></div>` : tarjetaConectar()}
    ${fam.codigo ? `<div class="tarjeta"><h2>Avisos de Dino</h2>${avisosActivos() ? '<p class="vacio">✅ Activados: 14:10 y 19:00, y cuando mamá te escribe.</p><button class="btn chico" data-act="probar-avisos">Mandarme uno de prueba</button>' : tarjetaAvisos()}</div>` : ''}
    <div class="tarjeta"><h2>Copia de seguridad</h2><p class="sub">Todo se guarda en este aparato. Bajate una copia de vez en cuando por si se borra (las fotos y archivos del cole no entran en la copia).</p>
    <div class="botones"><button class="btn" data-act="exportar">⬇️ Bajar copia</button><label class="btn">⬆️ Cargar copia<input type="file" accept="application/json" id="importar" hidden></label></div></div>
    <div class="tarjeta"><h2>Empezar de cero</h2><p class="sub">Borra todo lo que anotaste.</p><button class="btn peligro" data-act="borrar-todo">Borrar todo</button></div></div>`;
}

function pintarNav() {
  if (esMama()) { if (ui.mama !== 'chat') render(); return; }
  const nav = [['inicio', '🏠', 'Inicio'], ['colegio', '🎒', 'Colegio'], ['calendario', '📅', 'Calendario'], ['negocio', '🧁', 'Negocio'], ['chat', '🦖', 'Dino y mamá']];
  const n = noLeidos();
  document.getElementById('nav').innerHTML = nav.map(([k, i, l]) => `<button class="${ui.vista === k ? 'activa' : ''}" data-act="ir" data-v="${k}"><span>${i}</span>${l}${k === 'chat' && n ? `<b class="globo">${n}</b>` : ''}</button>`).join('');
}
// Barra fina arriba de las pestañas de mamá: botón Instalar donde el navegador lo permite, o los pasos a mano.
function bannerInstalarMama() {
  if (instalada() || leer('agenda-dulce-sin-banner', false)) return '';
  const pasos = pedidoInstalar ? '' : esIOS ? 'Tocá Compartir ⬆️ → <strong>Agregar a inicio</strong>' : /SamsungBrowser/i.test(navigator.userAgent) ? 'Menú ☰ → <strong>Agregar página a</strong> → Pantalla de inicio' : /Firefox/i.test(navigator.userAgent) ? 'Menú ⋮ → <strong>Instalar</strong>' : 'Menú ⋮ → <strong>Instalar app</strong> o <strong>Agregar a pantalla principal</strong>';
  return `<div class="instalar" style="padding:7px 10px;margin-bottom:8px;gap:8px"><img src="icono-192.png" alt="" style="width:32px;height:32px;border-radius:8px"><div style="font-size:13px"><b style="font-size:14px">📲 Tenela en tu pantalla</b><span>${pasos}</span></div>
    ${pedidoInstalar ? '<button class="btn primario chico" data-act="instalar">Instalar</button>' : ''}<button class="btn chico" data-act="ocultar-banner" aria-label="Cerrar">✕</button></div>`;
}
function pantallaQuien() {
  return `<header><div><small>Mi Agenda Dulce</small><h1>¿De quién es este celu?</h1></div></header>
    <div class="tarjeta" style="text-align:center"><img src="icono-192.png" alt="" style="width:84px;height:84px;border-radius:20px">
    <p class="sub" style="margin:8px 0 14px">Elegí una sola vez. Cada una entra con lo suyo.</p>
    <div style="display:grid;gap:10px"><button class="btn primario" style="padding:14px" data-act="soy" data-q="chica">👧 Soy Valentina</button>
    <button class="btn" style="padding:14px" data-act="soy" data-q="mama">👩 Soy mamá</button></div></div>`;
}
function render() {
  const d = new Date();
  if (fam.codigo && !fam.quien) {
    document.body.classList.add('mama');
    document.getElementById('app').innerHTML = pantallaQuien();
    return;
  }
  document.body.classList.toggle('mama', esMama());
  if (esMama()) {
    ui.vista = 'chat';
    const nom = esc(fam.nombre || 'Valentina');
    const pest = [['chat', '💬', 'Chat'], ['novedades', '🔔', 'Avisos'], ['tareas', '📝', 'Tareas'], ['examenes', '📚', 'Exámenes'], ['calendario', '📅', 'Calendario']];
    const titulos = { chat: '💬 Chat con ', novedades: '🔔 Avisos de ', tareas: '📝 Tareas de ', examenes: '📚 Exámenes de ', calendario: '📅 Calendario de ' };
    const globos = { chat: noLeidos(), novedades: novSinLeer() };
    const tabs = `<div class="pestanas">${pest.map(([k, i, l]) => `<button class="pestana ${ui.mama === k ? 'activa' : ''}" data-act="sub-mama" data-s="${k}"><span>${i}</span>${l}${globos[k] ? `<span class="globo">${globos[k]}</span>` : ''}</button>`).join('')}</div>`;
    document.getElementById('app').innerHTML = `<header><div><small>${DIAS_LARGOS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}</small><h1>${titulos[ui.mama]}${nom}</h1></div></header>${bannerInstalarMama()}${tabs}${ui.mama === 'chat' ? vistaChat() : `<div class="mama-cuerpo">${ui.mama === 'novedades' ? vistaNovedades() : vistaMama(ui.mama)}</div>`}`;
    if (ui.mama === 'chat') { pintarChat(true); if (noLeidos()) marcarLeidos(); }
    if (ui.mama === 'novedades' && novSinLeer()) marcarNovedadesLeidas();
    return;
  }
  const vistas = { inicio: vistaInicio, colegio: vistaColegio, calendario: vistaCalendario, negocio: vistaNegocio, chat: vistaChat, ajustes: vistaAjustes };
  const titulos = { inicio: S.nombre ? 'Hola, ' + esc(S.nombre) + ' 👋' : 'Mi agenda', colegio: 'Colegio', calendario: 'Calendario', negocio: 'Mi emprendimiento', chat: ui.chat === 'dino' ? 'Dino' : 'Mamá', ajustes: 'Ajustes' };
  document.getElementById('app').innerHTML = `<header><div><small>${DIAS_LARGOS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}</small><h1>${titulos[ui.vista]}</h1></div>
    <button class="icono" data-act="ir" data-v="${ui.vista === 'ajustes' ? 'inicio' : 'ajustes'}" aria-label="Ajustes">${ui.vista === 'ajustes' ? '✕' : '⚙️'}</button></header>${vistas[ui.vista]()}`;
  pintarNav();
  if (ui.vista === 'chat') {
    pintarChat(true);
    if (ui.chat === 'mama' && noLeidos()) marcarLeidos();
  }
}
const listo = () => { guardarTodo(); render(); };

function irADinoCon(texto, img) {
  ui.vista = 'chat'; ui.chat = 'dino';
  dinoAdjunto = img || null;
  render();
  const ta = document.getElementById('chat-texto');
  if (ta) { ta.value = texto; ta.focus(); }
}

/* ---------- eventos ---------- */
const buscar = (lista, id) => S[lista].find(x => x.id === id);
const acciones = {
  'ir': el => { ui.vista = el.dataset.v; if (el.dataset.s) ui[el.dataset.v] = el.dataset.s; window.scrollTo(0, 0); render(); },
  'sub-colegio': el => { ui.colegio = el.dataset.s; render(); },
  'sub-negocio': el => { ui.negocio = el.dataset.s; render(); },
  'sub-chat': el => { ui.chat = el.dataset.s; render(); },
  'sub-mama': el => { ui.mama = el.dataset.s; if (ui.mama !== 'chat' && agendaMama && Date.now() - agendaMama.t > 30000) agendaMama = null; render(); },
  'recargar-agenda': () => { agendaMama = null; render(); },
  'recargar-novedades': () => traerNovedades(),
  'copiar-ics': () => navigator.clipboard.writeText(agendaMama.ics).then(() => avisar('Link copiado'), () => prompt('Copiá este link:', agendaMama.ics)),
  'nueva-tarea': () => formTarea(),
  'tarea-edit': el => formTarea(buscar('tareas', el.dataset.id)),
  'tarea-ok': el => { const t = buscar('tareas', el.dataset.id); t.hecha = !t.hecha; if (t.hecha) { t.enCurso = false; avisar('¡Bien ahí! ✨'); } listo(); },
  'tarea-curso': el => { const t = buscar('tareas', el.dataset.id); t.enCurso = !t.enCurso; if (t.enCurso) avisar('¡Dale que podés! 💪'); listo(); },
  'tarea-dino': el => { const t = buscar('tareas', el.dataset.id); cerrarModal(); irADinoCon(`Tengo esta tarea de ${nombreMat(t.materiaId)}: "${t.titulo}". ¿Me ayudás a arrancar?`); },
  'ver-hechas': () => { ui.verHechas = !ui.verHechas; render(); },
  'nuevo-examen': () => formExamen(),
  'examen-edit': el => formExamen(buscar('examenes', el.dataset.id)),
  'examen-dino': el => { const e = buscar('examenes', el.dataset.id); cerrarModal(); irADinoCon(`Tengo examen de ${nombreMat(e.materiaId)} sobre "${e.tema}" ${e.fecha ? cuando(e.fecha) : ''}. ¿Me tomás preguntas para practicar?`); },
  'nueva-materia': () => formMateria(),
  'materia-edit': el => formMateria(buscar('materias', el.dataset.id)),
  'hor-agregar': el => {
    const d = el.dataset.d;
    abrirForm({ titulo: 'Agregar al ' + DIAS_LARGOS[d], campos: [{ nombre: 'm', label: 'Materia', tipo: 'select', opciones: S.materias.map(m => [m.id, m.nombre]) }],
      guardar: o => { if (o.m) (S.horario[d] = S.horario[d] || []).push(o.m); } });
  },
  'hor-quitar': el => { const { d, k } = el.dataset; if (confirm('¿Sacar ' + nombreMat(S.horario[d][k]) + ' del ' + DIAS_LARGOS[d] + '?')) { S.horario[d].splice(k, 1); listo(); } },
  'subir-foto': () => document.getElementById('subir-foto').click(),
  'subir-archivo': () => document.getElementById('subir-archivo').click(),
  'arch-materia': el => { ui.archMateria = el.dataset.id; render(); },
  'arch-edit': el => formArchivo(archivos.find(a => a.id === el.dataset.id)),
  'arch-abrir': el => { const a = archivos.find(x => x.id === el.dataset.id); const w = window.open(urlDe(a), '_blank'); if (!w) { const l = document.createElement('a'); l.href = urlDe(a); l.download = a.nombre; l.click(); } },
  'arch-dino': async el => {
    const a = archivos.find(x => x.id === el.dataset.id);
    cerrarModal();
    try { irADinoCon(`Esto es de ${a.materiaId ? nombreMat(a.materiaId) : 'el cole'}${a.nota ? ' (' + a.nota + ')' : ''}. ¿Me ayudás a entenderlo?`, await achicarImagen(a.blob)); }
    catch (e) { avisar('No pude abrir la foto'); }
  },
  'cal-mes': el => { const [y, m] = ui.calMes.split('-').map(Number); ui.calMes = iso(new Date(y, m - 1 + Number(el.dataset.n), 1)).slice(0, 7); render(); },
  'cal-dia': el => { ui.calDia = el.dataset.f; ui.calMes = el.dataset.f.slice(0, 7); render(); },
  'nuevo-evento': () => formEvento(),
  'evento-edit': el => formEvento(buscar('eventos', el.dataset.id)),
  'ocultar-ejemplo': () => { S.ejemplos = false; listo(); },
  'nuevo-ingrediente': () => formIngrediente(),
  'ingrediente-edit': el => formIngrediente(buscar('ingredientes', el.dataset.id)),
  'a-lista': el => { sumarALista(el.dataset.id, 1); avisar('Agregado a la lista 🛒'); listo(); },
  'item-lista': () => formItemLista(),
  'lista-receta': el => formListaDesdeReceta(el.dataset.id),
  'lista-check': el => { const l = buscar('lista', el.dataset.id); l.check = !l.check; listo(); },
  'lista-mas': el => { buscar('lista', el.dataset.id).paquetes++; listo(); },
  'lista-menos': el => { const l = buscar('lista', el.dataset.id); l.paquetes--; if (l.paquetes <= 0) S.lista = S.lista.filter(x => x !== l); listo(); },
  'terminar-compra': () => formTerminarCompra(),
  'nueva-receta': () => abrirReceta(),
  'receta-edit': el => abrirReceta(buscar('recetas', el.dataset.id)),
  'r-agregar': () => { recetaEdit.items.push(itemNuevo()); pintarReceta(); const ins = document.querySelectorAll('[data-rc="nombre"][data-ri]'); ins[ins.length - 1]?.focus(); },
  'r-quitar': el => { recetaEdit.items.splice(Number(el.dataset.k), 1); pintarReceta(); },
  'r-guardar': () => {
    const r = recetaEdit;
    if (!r.nombre.trim()) { avisar('Ponele un nombre a la receta'); return; }
    let nuevos = 0;
    const items = [];
    for (const it of r.items) {
      const n = (it.nombre || '').trim();
      if (!n || num(it.cant) <= 0) continue;
      let i = ingPorNombre(n);
      if (!i) {
        i = { id: uid(), nombre: n.charAt(0).toUpperCase() + n.slice(1), cantidad: it.unidad === 'u' ? 1 : 1000, unidad: it.unidad || 'g', precio: 0 };
        S.ingredientes.push(i);
        nuevos++;
      }
      items.push({ ingId: i.id, cant: num(it.cant) });
    }
    if (r.items.some(it => (it.nombre || '').trim() && num(it.cant) <= 0)) { avisar('Poné cuánto usás de cada ingrediente'); return; }
    r.items = items;
    if (nuevos) setTimeout(() => avisar(`Sumé ${nuevos} producto${nuevos === 1 ? '' : 's'} al Súper: poneles el precio 🏪`), 50);
    r.rinde = num(r.rinde) || 1;
    r.precio = num(r.precio);
    if (r.id) Object.assign(receta(r.id), r); else S.recetas.push({ ...r, id: uid() });
    cerrarModal(); listo();
  },
  'r-borrar': () => { if (confirm('¿Borrar esta receta?')) { S.recetas = S.recetas.filter(x => x.id !== recetaEdit.id); cerrarModal(); listo(); } },
  'nueva-venta': () => formVenta(),
  'venta-edit': el => formVenta(buscar('ventas', el.dataset.id)),
  'venta-entregado': el => { const v = buscar('ventas', el.dataset.id); v.entregado = !v.entregado; listo(); },
  'venta-pagado': el => { const v = buscar('ventas', el.dataset.id); v.pagado = !v.pagado; if (v.pagado) avisar('💰 +' + plata(totalVenta(v))); listo(); },
  'nuevo-gasto': () => formGasto(),
  'gasto-edit': el => formGasto(buscar('gastos', el.dataset.id)),
  'fin-mes': el => { const [y, m] = ui.finMes.split('-').map(Number); ui.finMes = iso(new Date(y, m - 1 + Number(el.dataset.n), 1)).slice(0, 7); render(); },
  'chat-enviar': () => {
    const ta = document.getElementById('chat-texto');
    const t = ta.value;
    ta.value = '';
    ta.style.height = '';
    if (!esMama() && ui.chat === 'dino') preguntarDino(t); else enviarMensaje(t);
  },
  'dino-sugerencia': el => {
    const t = el.textContent;
    if (t.includes('📷')) { document.getElementById('dino-foto').click(); return; }
    preguntarDino(t);
  },
  'dino-foto': () => document.getElementById('dino-foto').click(),
  'dino-sin-foto': () => { dinoAdjunto = null; pintarChat(); },
  'dino-accion': el => {
    const a = dino[Number(el.dataset.i)].acciones[Number(el.dataset.k)];
    a.estado = el.dataset.r;
    if (a.estado === 'si') { avisar(aplicarAccion(a)); guardarTodo(); }
    guardarDino();
    pintarChat();
  },
  'activar-avisos': () => activarAvisos(),
  'probar-avisos': () => suscribirPush(true).then(() => avisar('Te mandé uno 🔔'), () => avisar('No pude mandarlo')),
  'conectar': () => conectarCon(document.getElementById('link-conexion').value),
  'soy': async el => {
    const quien = el.dataset.q;
    if (el.dataset.confirmar && !confirm('¿Pasar este celu al modo mamá? Va a ver el chat y la agenda de Valentina.')) return;
    fam = { codigo: fam.codigo, quien };
    escribir(KEY_FAMILIA, fam);
    if (avisosActivos()) await suscribirPush(false).catch(() => {});
    location.reload();
  },
  'novedades-todas': () => { ui.verTodasNov = true; render(); },
  'instalar': async () => { if (!pedidoInstalar) return; pedidoInstalar.prompt(); await pedidoInstalar.userChoice.catch(() => {}); pedidoInstalar = null; render(); },
  'ocultar-instalar': () => { S.ocultarInstalar = true; listo(); },
  'ocultar-banner': () => { escribir('agenda-dulce-sin-banner', true); render(); },
  'aj-guardar': () => { S.nombre = document.getElementById('aj-nombre').value.trim(); S.margen = num(document.getElementById('aj-margen').value) || 2.5; avisar('Guardado'); listo(); },
  'exportar': () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
    a.download = 'mi-agenda-' + hoy() + '.json';
    a.click();
  },
  'borrar-todo': () => { if (confirm('¿Seguro? Se borra todo lo que anotaste.') && confirm('¿Segurísima?')) { S = semilla(); dino = []; guardarDino(); ui.vista = 'inicio'; listo(); } },
  'm-cerrar': () => cerrarModal(),
  'm-borrar': () => { if (confirm('¿Borrar?')) { formActual.borrar(); cerrarModal(); listo(); } }
};

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { cerrarModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  acciones[el.dataset.act]?.(el);
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'f' || !formActual) return;
  e.preventDefault();
  if (formActual.guardar(leerForm(e.target)) === false) return;
  cerrarModal(); listo();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'chat-texto') { el.style.height = ''; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; return; }
  if (!recetaEdit || !el.dataset.rc) return;
  if (el.dataset.ri != null) recetaEdit.items[Number(el.dataset.ri)][el.dataset.rc] = el.value;
  else recetaEdit[el.dataset.rc] = el.value;
  if (el.dataset.rc === 'nombre' && el.dataset.ri != null) {
    const k = Number(el.dataset.ri), celda = document.getElementById('u-' + k), u = celdaUnidad(recetaEdit.items[k], k);
    if (celda && celda.dataset.tipo !== u.tipo) { celda.dataset.tipo = u.tipo; celda.innerHTML = u.html; }
  }
  pintarTotalReceta();
});
document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.cambio === 'lista-precio') { buscar('lista', el.dataset.id).precio = num(el.value); listo(); }
  if ((el.id === 'subir-archivo' || el.id === 'subir-foto') && el.files.length) { await guardarArchivos([...el.files]); el.value = ''; }
  if (el.id === 'dino-foto' && el.files[0]) {
    try { dinoAdjunto = await achicarImagen(el.files[0]); } catch (err) { avisar('No pude leer esa foto'); }
    el.value = '';
    pintarChat();
  }
  if (el.id === 'importar' && el.files[0]) {
    el.files[0].text().then(t => {
      try { const d = JSON.parse(t); if (!d.materias || !d.recetas) throw 0; S = Object.assign(semilla(), d); listo(); avisar('Copia cargada ✅'); }
      catch (err) { avisar('Ese archivo no es una copia de la agenda'); }
    });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'chat-texto' && matchMedia('(pointer:fine)').matches) { e.preventDefault(); acciones['chat-enviar'](); }
  if (e.key === 'Escape' && !document.getElementById('modal').hidden) cerrarModal();
});
render();
(() => {
  const ir = new URLSearchParams(location.search).get('ir');
  if (!ir) return;
  history.replaceState(null, '', location.pathname);
  if (esMama()) ui.mama = ['chat', 'novedades', 'tareas', 'examenes', 'calendario'].includes(ir) ? ir : 'novedades';
  else if (ir === 'chat') { ui.vista = 'chat'; ui.chat = 'mama'; }
  else if (ir === 'tareas') { ui.vista = 'colegio'; ui.colegio = 'tareas'; }
  render();
})();
if (fam.codigo && fam.quien) {
  traerMensajes();
  traerNovedades();
  if (avisosActivos()) suscribirPush(false).catch(() => {});
  if (esChica()) sincronizar();
  if (esMama() && !fam.nombre) api('hola').then(r => { if (r.nombre) { fam.nombre = r.nombre; escribir(KEY_FAMILIA, fam); render(); } }).catch(() => {});
}
</script>
</body>
</html>
